name: Bug report
description: Something does not work as documented.
labels: ["bug", "needs triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Component
      placeholder: Button

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A minimal code sample, or a link to a reproduction.
      render: tsx
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Library version
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Framework and version, React version, Tailwind version, browser.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am using Tailwind CSS v4 (v3 is not supported)
          required: true
        - label: I searched existing issues
          required: true
