name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  STORYBOOK_DISABLE_TELEMETRY: 1

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Before anything type-aware. The docs app imports @dowel-ui/react, whose
      # types live in dist/, so on a clean checkout every typed lint rule sees
      # `any` and reports hundreds of unsafe-member-access errors that say
      # nothing about the code. This passed locally for months only because a
      # dist/ from an earlier build was always lying around.
      - name: Build
        run: pnpm build

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Every package but the components through turbo; the components once,
      # with coverage, so the thresholds in packages/ui/vitest.config.ts are a
      # gate rather than a comment. Running them twice would double the
      # longest suite for nothing.
      - name: Test
        run: pnpm turbo run test --filter=!@dowel-ui/react

      - name: Test the components, with coverage thresholds
        run: pnpm --filter @dowel-ui/react test:coverage

      - name: Test the audit scripts
        run: pnpm test:scripts

      # Contrast cannot be checked by the per-component accessibility tests,
      # which run in an environment that never paints. This checks the palette
      # at the source instead.
      - name: Audit
        run: pnpm run audit:all

      - name: Build Storybook
        run: pnpm build-storybook

      # The docs site is the registry's host and the library's first consumer,
      # so a break here means the published package is broken for everyone else.
      - name: Build docs
        run: pnpm --filter @dowel-ui/docs build

      # A non-deterministic registry makes every publish look like a change and
      # hides the ones that matter. Compared directly rather than through git,
      # since the output directory is not tracked.
      - name: Verify the registry build is deterministic
        run: |
          pnpm --filter @dowel-ui/registry exec tsx src/build.ts --out /tmp/registry-a
          pnpm --filter @dowel-ui/registry exec tsx src/build.ts --out /tmp/registry-b
          diff -r /tmp/registry-a /tmp/registry-b

  # The published CLI, MCP server and scaffolder promise Node 20 in `engines`;
  # everything above runs on 24. This runs their built output on the floor
  # and the version between, the way `npx` would start it.
  binaries:
    name: Binaries on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6

      # Built on the toolchain's own Node; tsdown needs 22.18 or later.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the binaries and the registry they read
        run: >-
          pnpm turbo run build --filter=@dowel-ui/cli --filter=@dowel-ui/mcp
          --filter=create-dowel-app --filter=@dowel-ui/registry

      # No package-manager cache here. setup-node caches by default when
      # package.json names a package manager, and doing so runs `pnpm store
      # path` on this Node — pnpm 11 needs `node:sqlite`, which Node 20 does not
      # have, so the step crashed before the binaries were ever run.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Run them
        run: node scripts/smoke/binaries.mjs

  # The release check RELEASING.md used to ask for by hand: every free item,
  # installed by the local CLI from the local registry into a fresh app, then
  # `tsc` and `next build`. On every pull request rather than only on main:
  # it took 9 minutes locally (2 of them npm), it runs alongside `verify`
  # rather than after it, so it adds no wall-clock time, and it is the check
  # that has caught the most bugs nothing else saw.
  install-all:
    name: Install every item into a fresh app
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the scaffolder, the CLI and the registry
        run: >-
          pnpm turbo run build --filter=@dowel-ui/cli --filter=create-dowel-app
          --filter=@dowel-ui/registry
      - name: Install everything and build the app
        run: node scripts/smoke/install-all.mjs

  branding:
    name: Branding placeholder report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Informational until naming is settled. Releasing runs this with
      # --strict (RELEASING.md, step 3), which fails on any surviving placeholder.
      - name: Report placeholders
        run: pnpm check:branding
