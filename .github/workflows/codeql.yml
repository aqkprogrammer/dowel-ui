name: CodeQL

# Static analysis for the code that runs on someone else's machine (the CLI,
# the MCP server, the scaffolder) and the routes that check licences.
# SECURITY.md covers shipped code; this is part of how that promise is kept.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
